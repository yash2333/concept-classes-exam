services:
  - type: web
    name: concept-classes-lms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: concept-classes-db
          property: connectionString

databases:
  - name: concept-classes-db
